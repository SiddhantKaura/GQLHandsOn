type Query {
  "Fetch a list of tracks"
  tracks: [Track!]!
  "Fetch a specific track by Id"
  track(id: ID!): Track
  "Fetch a specific module by Id"
  module(id: ID!): Module
}

type Mutation {
  "Increments the track views."
  incrementTrackViews(id: ID!): IncrementTrackViewsResponse!
}

"Increment TrackViews response unit."
type IncrementTrackViewsResponse {
  code: Int!
  message: String!
  success: Boolean!
  track: Track
}

"Track Unit."
type Track {
  "Unique identifier of the track."
  id: ID!
  "Title of the track."
  title: String!
  "Thumbnail path of the track."
  thumbnail: String
  "Length of the track."
  length: Int
  "Number of modules count."
  modulesCount: Int
  "Author of the track."
  author: Author!
  "Description of the track."
  description: String
  "Number of Views."
  numberOfViews: Int
  "List of modules."
  modules: [Module!]!
}

"Module Unit."
type Module {
  "Unique identifier of the module."
  id: ID!
  "Name of the module."
  title: String!
  "Length of the module."
  length: Int
  "Video path of the module"
  videoUrl: String
  "Content of the module"
  content: String
}

"Author Unit."
type Author {
  "Unique identifier of author."
  id: ID!
  "Name of author."
  name: String!
  "Photo of author."
  photo: String
}
